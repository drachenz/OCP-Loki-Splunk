apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Prerequisites (installed separately, not managed here):
#   - Red Hat OpenShift Logging Operator
#   - Loki Operator
#   - Cluster Observability Operator
#
# The openshift-logging Namespace is intentionally not managed here. The
# Logging Operator is installed in it, and deleting this configuration must
# not remove the operator.
#
# Overlays must provide:
#   - Secret logging-loki-s3   LokiStack object storage credentials
#   - Secret splunk-hec        Splunk HEC token (key: hecToken)
#   - LokiStack storageClassName
#   - Splunk output URL

resources:
  - rbac.yaml
  - lokistack.yaml
  - clusterlogforwarder.yaml
  - uiplugin.yaml
